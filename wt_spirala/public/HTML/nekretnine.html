<!DOCTYPE html>
<html lang="bs-BA">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nekretnine</title>
    <link rel="stylesheet" type="text/css" href="../Style/nekretnine.css">
</head>

<body>
    <!-- Navigacioni meni -->
    <iframe src="../HTML/meni.html"></iframe>

    <!-- Kriterijumi pretrage -->
    <div id="search-container" class="grid-container">
        <label for="minCijena">Min Cijena:</label>
        <input type="number" id="minCijena" name="minCijena">

        <label for="maxCijena">Max Cijena:</label>
        <input type="number" id="maxCijena" name="maxCijena">

        <label for="minKvadratura">Min Kvadratura:</label>
        <input type="number" id="minKvadratura" name="minKvadratura">

        <label for="maxKvadratura">Max Kvadratura:</label>
        <input type="number" id="maxKvadratura" name="maxKvadratura">

        <button id="dugmePretraga">Pretraga</button>
    </div>

    <h2 id="naslov-top5" style="text-align: center; display: none;">
        Top 5 nekretnina za lokaciju: <span id="lokacija-naslov"></span>
    </h2>
    

   <!--  <h2 style="text-align: center;">Top 5 nekretnina za lokaciju: <span id="lokacija-naslov"></span></h2> -->

    <!-- Prikaz nekretnina podijeljen prema tipu -->
    <div id="divNekretnine">
        <h1 style="text-align: center;">Stan</h1>
        <div class="grid-lista-nekretnina" id="stan">
            <!-- Stanovi će biti prikazani ovdje putem JavaScript-a -->
        </div>
        
        <h1 style="text-align: center;">Kuća</h1>
        <div class="grid-lista-nekretnina" id="kuca">
            <!-- Kuće će biti prikazane ovdje putem JavaScript-a -->
        </div>
        
        <h1 style="text-align: center;">Poslovni prostor</h1>
        <div class="grid-lista-nekretnina" id="pp">
            <!-- Poslovni prostori će biti prikazani ovdje putem JavaScript-a -->
        </div>
    </div>

    <!-- Učitavanje JavaScript datoteka -->
    <script src="../Scripts/MarketingAjax.js"></script>
    <script src="../Scripts/PoziviAjax.js"></script>
    <script src="../Scripts/SpisakNekretnina.js"></script>
    <script src="../Scripts/nekretnine.js"></script>
</body>

</html>
